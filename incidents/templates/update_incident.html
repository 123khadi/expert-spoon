<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container p-5">
<div class="card p-4 mx-auto" style="max-width:500px">
<h4>Update Incident</h4>
<form method="POST">
{% csrf_token %}
<label>Status</label>
<select name="status" class="form-control mb-2">
<option>Reported</option><option>In-Progress</option><option>Resolved</option>
</select>
<label>Severity</label>
<select name="severity" class="form-control mb-2">
<option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
</select>
<label>Assigned To</label>
<input name="assigned_to" class="form-control mb-3" placeholder="e.g. Rescue 1122">
<button class="btn btn-primary w-100">Save & Auto Generate AI SOP</button>
</form>
</div>
</div>
</body>
</html>
