{% load socialaccount %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - RapidSOP Mardan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Arial; background:#f0f2f5; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0;">
<div style="background:white; padding:40px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:380px; text-align:center;">
    
    <h2 style="color:#1877f2; margin:0;">RapidSOP Login</h2>
    <p style="color:#666; margin:5px 0 20px 0;">DC Office Mardan Control Room</p>

    <!-- Normal Login Form - ye sab se important hai -->
    <form method="post" action="{% url 'account_login' %}" style="text-align:left;">
        {% csrf_token %}
        {% if form.errors %}
            <div style="background:#ffebe8; border:1px solid #ff5a5a; padding:10px; border-radius:6px; color:#d00; font-size:14px; margin-bottom:15px;">
                Username ya Password galat hai.
            </div>
        {% endif %}
        
        <label style="font-weight:bold; font-size:14px;">Username / Email</label>
        <input type="text" name="login" required style="width:100%; padding:10px; margin:6px 0 15px 0; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">
        
        <label style="font-weight:bold; font-size:14px;">Password</label>
        <input type="password" name="password" required style="width:100%; padding:10px; margin:6px 0 20px 0; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;">

        <button type="submit" style="width:100%; background:#2e7d32; color:white; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px;">
            Login karein
        </button>
    </form>

    <div style="display:flex; align-items:center; margin:20px 0;">
        <hr style="flex:1;"><span style="margin:0 10px; color:#888; font-size:13px;">YA</span><hr style="flex:1;">
    </div>

    <a href="{% provider_login_url 'facebook' %}" style="display:block; background:#1877f2; color:white; padding:12px; border-radius:6px; text-decoration:none; font-weight:bold;">
        📘 Facebook se Login karein
    </a>

    <a href="{% provider_login_url 'google' %}" style="display:block; background:#fff; color:#444; border:1px solid #ddd; padding:12px; border-radius:6px; text-decoration:none; font-weight:bold; margin-top:10px;">
        🔍 Google se Login karein
    </a>

    <hr style="margin:25px 0 15px 0;">
    <a href="/dashboard/" style="color:#1877f2; text-decoration:none; font-size:14px;">Dashboard par wapas</a>
    <br><br>
    <a href="{% url 'account_signup' %}" style="color:#666; text-decoration:none; font-size:13px;">Naya account banayein</a>

</div>
</body>
</html>
