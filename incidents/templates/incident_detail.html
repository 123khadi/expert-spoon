<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container p-4">
<a href="/dashboard/" class="btn btn-secondary mb-3">← Dashboard</a>
<div class="card p-4">
<h3>{{ incident.title }}</h3>
<p><b>Severity:</b> {{ incident.severity }} | <b>Status:</b> {{ incident.status }}</p>
<p>{{ incident.description }}</p>
<h5 class="mt-3">🤖 AI Generated SOP:</h5>
<div class="alert alert-info" style="white-space: pre-wrap;">{{ incident.ai_sop }}</div>
<a href="/incidents/{{ incident.id }}/update/" class="btn btn-primary">Update & Regenerate SOP</a>
<a href="https://wa.me/?text=*{{ incident.title }}*%0A{{ incident.ai_sop }}%0ALocation:%20https://maps.google.com/?q={{ incident.latitude }},{{ incident.longitude }}" target="_blank" class="btn btn-success">📱 WhatsApp Share</a>
</div>
</div>
